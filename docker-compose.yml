services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iptv-middleware-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - hls-streams:/var/www/storage/app/streams
      - vod-storage:/var/www/storage/app/public/vod
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_HOST: mysql
      DB_DATABASE: ${DB_DATABASE:-iptv_middleware}
      DB_USERNAME: ${DB_USERNAME:-iptv}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
    networks:
      - iptv-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Queue worker — processes background jobs
  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iptv-middleware-queue
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    volumes:
      - ./:/var/www
      - hls-streams:/var/www/storage/app/streams
      - vod-storage:/var/www/storage/app/public/vod
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_HOST: mysql
      DB_DATABASE: ${DB_DATABASE:-iptv_middleware}
      DB_USERNAME: ${DB_USERNAME:-iptv}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
    networks:
      - iptv-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Scheduler — runs artisan schedule:run every minute
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iptv-middleware-scheduler
    restart: unless-stopped
    working_dir: /var/www
    command: >
      sh -c "while true; do php artisan schedule:run >> /dev/null 2>&1; sleep 60; done"
    volumes:
      - ./:/var/www
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_HOST: mysql
      DB_DATABASE: ${DB_DATABASE:-iptv_middleware}
      DB_USERNAME: ${DB_USERNAME:-iptv}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
    networks:
      - iptv-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: iptv-middleware-nginx
    restart: unless-stopped
    ports:
      - "25460:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./docker/nginx/tuning.conf:/etc/nginx/conf.d/tuning.conf
      - hls-streams:/var/www/storage/app/streams
    tmpfs:
      - /var/www/storage/app/streams/hls:size=2G
    networks:
      - iptv-network
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: iptv-middleware-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_USER: ${DB_USERNAME:-iptv}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - iptv-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-secret}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: iptv-middleware-redis
    restart: unless-stopped
    networks:
      - iptv-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  iptv-network:
    driver: bridge

volumes:
  mysql-data:
    driver: local
  hls-streams:
    driver: local
  vod-storage:
    driver: local
