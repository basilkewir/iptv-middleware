version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iptv-middleware-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_HOST: mysql
      DB_DATABASE: ${DB_DATABASE:-iptv_middleware}
      DB_USERNAME: ${DB_USERNAME:-iptv}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
    networks:
      - iptv-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: iptv-middleware-nginx
    restart: unless-stopped
    ports:
      - "25460:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - iptv-network
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: iptv-middleware-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-iptv_middleware}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_USER: ${DB_USERNAME:-iptv}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - iptv-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-secret}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: iptv-middleware-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - iptv-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  node:
    image: node:18-alpine
    container_name: iptv-middleware-node
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - iptv-network
    entrypoint: ["npm"]

networks:
  iptv-network:
    driver: bridge

volumes:
  mysql-data:
    driver: local