version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iptv-middleware-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - hls-streams:/var/www/storage/app/streams
      - vod-storage:/var/www/storage/app/public/vod
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_HOST: mysql
      DB_DATABASE: ${DB_DATABASE:-iptv_middleware}
      DB_USERNAME: ${DB_USERNAME:-iptv}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      XC_VM_ENABLED: "true"
      XC_VM_URL: "http://xcvm"
      XC_VM_PORT: "25462"
      XC_VM_PROXY_PLAYER: "true"
      XC_VM_PROXY_URL: "http://xcvm"
      XC_VM_PROXY_PORT: "25462"
      XC_VM_PROXY_TIMEOUT: "60"
    networks:
      - iptv-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Queue worker — processes XcVmSyncJob and other background jobs
  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iptv-middleware-queue
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    volumes:
      - ./:/var/www
      - hls-streams:/var/www/storage/app/streams
      - vod-storage:/var/www/storage/app/public/vod
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_HOST: mysql
      DB_DATABASE: ${DB_DATABASE:-iptv_middleware}
      DB_USERNAME: ${DB_USERNAME:-iptv}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      XC_VM_ENABLED: "true"
      XC_VM_URL: "http://xcvm"
      XC_VM_PORT: "25462"
      XC_VM_PROXY_PLAYER: "true"
    networks:
      - iptv-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Scheduler — runs artisan schedule:run every minute
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iptv-middleware-scheduler
    restart: unless-stopped
    working_dir: /var/www
    command: >
      sh -c "while true; do php artisan schedule:run >> /dev/null 2>&1; sleep 60; done"
    volumes:
      - ./:/var/www
    environment:
      APP_ENV: local
      DB_HOST: mysql
      DB_DATABASE: ${DB_DATABASE:-iptv_middleware}
      DB_USERNAME: ${DB_USERNAME:-iptv}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      XC_VM_ENABLED: "true"
      XC_VM_URL: "http://xcvm"
      XC_VM_PORT: "25462"
    networks:
      - iptv-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: iptv-middleware-nginx
    restart: unless-stopped
    ports:
      - "25460:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - hls-streams:/var/www/storage/app/streams
    networks:
      - iptv-network
    depends_on:
      - app

  # XC-VM streaming engine — built from source, admin panel on host port 25462
  xcvm:
    image: iptv-xcvm:latest
    build:
      context: ./docker/xcvm
      dockerfile: Dockerfile
    container_name: iptv-middleware-xcvm
    restart: unless-stopped
    volumes:
      - xcvm-data:/home/xc_vm
      - vod-storage:/home/xc_vm/vod_bridge:ro
    environment:
      XCVM_DB_HOST: mysql
      XCVM_DB_NAME: ${XCVM_DB_NAME:-xcvm}
      XCVM_DB_USER: ${XCVM_DB_USER:-xcvm}
      XCVM_DB_PASS: ${XCVM_DB_PASS:-xcvmsecret}
      XCVM_HTTP_PORT: "25462"
    ports:
      - "25462:25462"
    networks:
      - iptv-network
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:25462/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mysql:
    image: mysql:8.0
    container_name: iptv-middleware-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_USER: ${DB_USERNAME:-iptv}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - iptv-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-secret}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: iptv-middleware-redis
    restart: unless-stopped
    networks:
      - iptv-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  iptv-network:
    driver: bridge

volumes:
  mysql-data:
    driver: local
  hls-streams:
    driver: local
  vod-storage:
    driver: local
  xcvm-data:
    driver: local
