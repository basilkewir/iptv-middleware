name: Build and deploy installed servers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: bcmath, ctype, curl, dom, fileinfo, gd, intl, mbstring, pdo_sqlite, sqlite3, xml, zip
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run tests
        run: php artisan test --filter=MyChannelHlsServiceTest

      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: Install production PHP dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Package production release
        run: |
          set -euo pipefail
          package_dir="$RUNNER_TEMP/iptv-release"
          mkdir -p "$package_dir"
          git archive HEAD | tar -x -C "$package_dir"
          cp -a vendor "$package_dir/vendor"
          cp -a public/build "$package_dir/public/build"
          test -f "$package_dir/vendor/autoload.php"
          test -f "$package_dir/public/build/manifest.json"
          tar -czf "$RUNNER_TEMP/iptv-release.tar.gz" -C "$package_dir" .

      - name: Upload release
        uses: actions/upload-artifact@v4
        with:
          name: iptv-production-release
          path: ${{ runner.temp }}/iptv-release.tar.gz
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_TARGETS != ''
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(vars.DEPLOY_TARGETS || '[]') }}
    runs-on: [self-hosted, linux, "${{ matrix.target.runner }}"]
    concurrency:
      group: production-deploy-${{ matrix.target.runner }}
      cancel-in-progress: false
    steps:
      - name: Download release
        uses: actions/download-artifact@v4
        with:
          name: iptv-production-release
          path: ${{ runner.temp }}/iptv-release-artifact

      - name: Apply release to installed stack
        env:
          APP_DIR: ${{ matrix.target.app_dir }}
          RELEASE_ARCHIVE: ${{ runner.temp }}/iptv-release-artifact/iptv-release.tar.gz
        run: |
          set -euo pipefail
          release_dir="$(mktemp -d "$RUNNER_TEMP/iptv-release.XXXXXX")"
          trap 'rm -rf "$release_dir"' EXIT
          tar -xzf "$RELEASE_ARCHIVE" -C "$release_dir"
          bash "$release_dir/deploy/deploy-installed-stack.sh" "$APP_DIR" "$release_dir"
