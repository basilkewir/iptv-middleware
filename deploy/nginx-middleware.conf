##
## IPTV Middleware — production Nginx config
## Generated by install.sh — edit port/domain as needed.
## XC-VM is on 127.0.0.1:${XCVM_PORT} and is NEVER referenced here.
##

server {
    listen 25460 reuseport;
    listen [::]:25460;
    server_name _;

    root /opt/iptv-middleware/public;
    index index.php;

    charset utf-8;

    # Large VOD uploads (no limit — PHP controls the actual cap)
    client_max_body_size 0;
    client_body_timeout 3600s;
    send_timeout 3600s;

    fastcgi_read_timeout 300s;
    fastcgi_send_timeout 300s;
    fastcgi_connect_timeout 60s;

    # ── Internal HLS location (X-Accel-Redirect target) ──────────────────────
    # Hidden from the public — only reachable via Nginx internal redirect.
    # PHP authenticates the player, then hands off to Nginx for zero-CPU
    # file delivery directly from the tmpfs RAM disk.
    location /internal_hls/ {
        internal;
        alias /opt/iptv-middleware/storage/app/streams/hls/;

        add_header Cache-Control "public, max-age=2, must-revalidate";
        add_header Pragma "cache";
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
        add_header X-Accel-Buffering "no";
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
        }
    }

    # ── Internal local VOD (X-Accel-Redirect for local files) ─────────────────
    location /internal_local_vod/ {
        internal;
        alias /opt/iptv-middleware/storage/app/public/vod/;
        add_header Access-Control-Allow-Origin "*";
        add_header X-Accel-Buffering "yes";
    }

    # ── Internal remote VOD proxy (X-Accel-Redirect for remote URLs) ──────────
    location = /internal_remote_vod {
        internal;
        resolver 8.8.8.8 valid=30s;
        set $target_host $upstream_http_x_target_host;
        set $target_uri  $upstream_http_x_target_uri;
        proxy_pass $target_host$target_uri;
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 16 256k;
        proxy_busy_buffers_size 512k;
        proxy_set_header Host $proxy_host;
        proxy_hide_header X-Target-Host;
        proxy_hide_header X-Target-URI;
    }

    # ── Internal local VOD (X-Accel-Redirect for local files) ─────────────────
    location /internal_local_vod/ {
        internal;
        alias /opt/iptv-middleware/storage/app/public/vod/;
        add_header Access-Control-Allow-Origin "*";
        add_header X-Accel-Buffering "yes";
    }

    # ── Internal remote VOD proxy (X-Accel-Redirect for remote URLs) ──────────
    location = /internal_remote_vod {
        internal;
        resolver 8.8.8.8 valid=30s;
        set $target_host $upstream_http_x_target_host;
        set $target_uri  $upstream_http_x_target_uri;
        proxy_pass $target_host$target_uri;
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 16 256k;
        proxy_busy_buffers_size 512k;
        proxy_set_header Host $proxy_host;
        proxy_hide_header X-Target-Host;
        proxy_hide_header X-Target-URI;
    }

    # ── Legacy /hls/ direct access (kept for admin panel preview) ────────────
    location /hls/ {
        alias /opt/iptv-middleware/storage/app/streams/hls/;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
        }
        # Return 204 for missing segments so players keep polling
        # instead of hard-erroring on a momentary ingest restart.
        try_files $uri =204;
    }

    # ── Public live stream endpoint (routes through PHP for auth) ─────────────
    # Every request hits PHP for authentication, then Nginx serves the file
    # via X-Accel-Redirect. This prevents the player from bypassing auth
    # after the initial 302 redirect.
    location ~ ^/live/[^/]+/[^/]+/[^/]+/.+\.(m3u8|ts)$ {
        try_files $uri /index.php?$query_string;
    }

    # ── Offline channel HLS ─────────────────────────────────────────────────
    location /hls/offline/ {
        alias /opt/iptv-middleware/storage/app/streams/hls/offline/;
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin "*";
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
        }
    }

    # ── Public storage (VOD posters, logos, uploaded files) ────────────────
    location /storage/ {
        alias /opt/iptv-middleware/storage/app/public/;
        expires 7d;
        add_header Cache-Control "public";
        add_header Access-Control-Allow-Origin "*";
    }

    # ── Main Laravel app ────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        try_files $uri /index.php?$query_string;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_buffering off;
    }

    location ~ /\.(?!well-known).* { deny all; }

    access_log /var/log/nginx/iptv-middleware.access.log;
    error_log  /var/log/nginx/iptv-middleware.error.log warn;
}
