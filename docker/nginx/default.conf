server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /var/www/public;
    index index.php;

    charset utf-8;
    client_max_body_size 0;
    fastcgi_read_timeout 300s;

    # ── Internal HLS location (X-Accel-Redirect target) ──────────────────────
    # Zero-CPU file delivery from tmpfs RAM disk. Anti-caching on playlists
    # prevents the "loop and repeat" bug; segments get short TTL for
    # concurrent multi-room clients.
    location /internal_hls/ {
        internal;
        alias /var/www/storage/app/streams/hls/;

        # Zero-buffer streaming — flush immediately to the socket
        proxy_buffering off;
        tcp_nodelay on;
        tcp_nopush off;
        sendfile off;

        # Playlists: absolute no-cache (fetch fresh every time)
        location ~* \.m3u8$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate, proxy-revalidate, max-age=0";
            add_header Expires "0";
            add_header Pragma "no-cache";
            add_header Access-Control-Allow-Origin "*";
            add_header X-Accel-Buffering "no";
            types {
                application/vnd.apple.mpegurl m3u8;
            }
        }

        # Segments: very short TTL for concurrent viewers
        location ~* \.ts$ {
            add_header Cache-Control "public, max-age=2";
            add_header Access-Control-Allow-Origin "*";
            add_header X-Accel-Buffering "no";
            types {
                video/mp2t ts;
            }
        }

        # Catch-all for any other HLS-related files
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Access-Control-Allow-Origin "*";
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
            video/mp4 mp4;
        }
    }

    # ── Internal local VOD (X-Accel-Redirect for local files) ─────────────────
    # Native MP4 streaming with byte-range scrubbing. Players can skip forward,
    # rewind, and seek instantly without downloading the entire file.
    location /internal_local_vod/ {
        internal;
        alias /var/www/storage/app/public/vod/;

        # Enable ngx_http_mp4_module for native MP4 byte-range support
        mp4;
        mp4_buffer_size 1m;
        mp4_max_buffer_size 5m;
        mp4_append_status off;

        add_header Access-Control-Allow-Origin "*";
        add_header Accept-Ranges "bytes";
        add_header Cache-Control "public, max-age=3600";
        add_header X-Accel-Buffering "yes";
    }

    # ── Unified Internal Media (VOD + Series byte-range delivery) ─────────────
    # Unified media routing. Serves both VOD movies and Series
    # episodes as native MP4 byte-range streams. Handles .mp4, .mkv, .avi,
    # .mov, .webm files. The ngx_http_mp4_module enables instant seeking
    # (pause, scrub, skip) without buffering the entire file.
    location /internal_media/ {
        internal;
        alias /var/www/storage/;

        # Enable native MP4 streaming and frame-seeking optimizations
        mp4;
        mp4_buffer_size 2m;
        mp4_max_buffer_size 10m;
        mp4_append_status off;

        # Byte-range support for player seeking
        proxy_buffering off;
        add_header Accept-Ranges "bytes";

        # Fast streaming performance attributes
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;

        # Static asset retention cache rules
        add_header Cache-Control "public, max-age=604800, immutable";
        add_header Access-Control-Allow-Origin "*";

        # Extended MIME type support for VOD/Series containers
        types {
            video/mp4 mp4;
            video/x-matroska mkv;
            video/x-msvideo avi;
            video/quicktime mov;
            video/webm webm;
            video/x-flv flv;
        }
    }

    # ── Internal remote VOD proxy (X-Accel-Redirect for remote URLs) ──────────
    location = /internal_remote_vod {
        internal;
        resolver 8.8.8.8 valid=30s;
        set $target_host $upstream_http_x_target_host;
        set $target_uri  $upstream_http_x_target_uri;
        proxy_pass $target_host$target_uri;
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 16 256k;
        proxy_busy_buffers_size 512k;
        proxy_set_header Host $proxy_host;
        proxy_hide_header X-Target-Host;
        proxy_hide_header X-Target-URI;
    }

    # ── Legacy /hls/ direct access (kept for admin panel preview) ────────────
    location /hls/ {
        alias /var/www/storage/app/streams/hls/;

        # Anti-caching for playlists
        location ~* \.m3u8$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate, proxy-revalidate, max-age=0";
            add_header Expires "0";
            add_header Pragma "no-cache";
            add_header Access-Control-Allow-Origin "*";
            add_header X-Accel-Buffering "no";
            types {
                application/vnd.apple.mpegurl m3u8;
            }
        }

        # Segments with short cache
        location ~* \.ts$ {
            add_header Cache-Control "public, max-age=2";
            add_header Access-Control-Allow-Origin "*";
            add_header X-Accel-Buffering "no";
            types {
                video/mp2t ts;
            }
        }

        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Access-Control-Allow-Origin "*";
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
            video/mp4 mp4;
        }

        try_files $uri =204;
    }

    # ── Public live stream endpoint (routes through PHP for auth) ─────────────
    # Every request hits PHP for authentication, then Nginx serves the file
    # via X-Accel-Redirect. This prevents the player from bypassing auth
    # after the initial 302 redirect.
    location ~ ^/live/[^/]+/[^/]+/[^/]+/.+\.(m3u8|ts)$ {
        try_files $uri /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        try_files $uri /index.php?$query_string;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_buffering off;
        fastcgi_connect_timeout 300s;
        fastcgi_send_timeout 300s;
        fastcgi_read_timeout 300s;
    }

    location ~ /\.(?!well-known).* { deny all; }
}
